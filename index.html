<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahmoud's Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            color: #fff;
            text-align: center;
            padding: 0;
            margin: 0;
            position: relative;
            background-image: url('1000150030.jpg'); /* تم تغيير الخلفية هنا */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            backdrop-filter: blur(3px);
            min-height: 100vh;
        }
        .header {
            padding: 30px 0;
            background-color: rgba(0, 0, 0, 0.6);
        }
        .header img {
            width: 100px;
            margin-bottom: 10px;
        }
        .header h1 {
            font-size: 3em;
            margin: 0;
            color: #FFD700;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        .content {
            padding: 20px;
            min-height: calc(100vh - 180px);
            background-color: rgba(0, 0, 0, 0.5);
        }
        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .social-links a {
            display: inline-block;
            padding: 10px;
            text-decoration: none;
            transition: transform 0.3s ease;
            position: relative;
        }
        .social-links a:hover {
            transform: scale(1.1);
        }
        .social-links img {
            width: 50px;
            height: 50px;
            border-radius: 10px;
        }
        .social-links .twitter-logo {
            width: 48px;
            height: 48px;
        }
        .social-links .tiktok-logo {
            width: 60px;
            height: 60px;
        }
        .social-links span {
            display: block;
            font-size: 0.8em;
            color: #fff;
            margin-top: 5px;
        }
        .footer {
            background-color: rgba(0, 0, 0, 0.6);
            color: #fff;
            padding: 20px;
            font-size: 0.9em;
        }
        .footer img {
            width: 100px;
            margin-bottom: 10px;
        }
        .contact-form {
            margin: 30px auto;
            max-width: 500px;
            background-color: rgba(255, 255, 255, 0.15);
            padding: 20px;
            border-radius: 10px;
            direction: rtl;
        }
        .contact-form input,
        .contact-form textarea,
        .contact-form button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #FFD700;
            border-radius: 5px;
            background-color: rgba(0,0,0,0.3);
            color: #fff;
            font-size: 1em;
        }
        .contact-form button {
            background-color: #FFD700;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        .contact-form button:hover {
            background-color: #FFC107;
        }
    </style>
</head>
<body>
    <div class="header">
        <img src="https://upload.wikimedia.org/wikipedia/en/5/56/Real_Madrid_CF.svg" alt="Real Madrid Logo">
        <h1>محمود أيـمـن</h1>
    </div>
    
    <div class="content">
        <div class="social-links">
            <a href="https://www.facebook.com/profile.php?id=100065422909184">
                <img src="https://upload.wikimedia.org/wikipedia/commons/5/51/Facebook_f_logo_%282019%29.svg" alt="Facebook">
            </a>
            <a href="https://www.instagram.com/mahmoud_ayman____ca7?igsh=bm51Y2JvamNsMnV2">
                <img src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png" alt="Instagram">
            </a>
            <a href="https://twitter.com/Mahmoud95130281">
                <img src="https://upload.wikimedia.org/wikipedia/commons/6/60/Twitter_Logo_as_of_2021.svg" class="twitter-logo" alt="Twitter">
                <span>تويتر</span>
            </a>
            <a href="https://www.tiktok.com/@beamustache?_t=8nudLoRzEMp&_r=1">
                <img src="https://upload.wikimedia.org/wikipedia/en/a/a9/TikTok_logo.svg" class="tiktok-logo" alt="TikTok">
                <span>تيك توك</span>
            </a>
            <!-- باقي الروابط الاجتماعية -->
        </div>

        <div class="contact-form">
            <h2>تواصل معي</h2>
            <form action="mailto:mahmoudayman1752007a@gmail.com" method="POST" enctype="text/plain">
                <input type="text" name="name" placeholder="الاسم بالكامل" required>
                <input type="email" name="email" placeholder="البريد الإلكتروني" required>
                <textarea name="message" rows="5" placeholder="اكتب رسالتك هنا..." required></textarea>
                <button type="submit">إرسال الرسالة</button>
            </form>
        </div>
    </div>

    <div class="footer">
        <img src="https://upload.wikimedia.org/wikipedia/en/5/56/Real_Madrid_CF.svg" alt="Real Madrid Logo">
        <p>© 2024 محمود أيـمـن. جميع الحقوق محفوظة</p>
    </div>
</body>
</html>
